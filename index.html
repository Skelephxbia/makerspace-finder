<style>
  :root{
    --bg:#1a1c1e;
    --panel:#212325;
    --line:#3a3d40;
    --text:#e8e6e1;
    --muted:#9a9d9f;
    --yellow:#f2c14e;
    --electronics:#4fb0a5;
    --wood:#c98a4b;
    --hardware:#6b8fa3;
    --laser:#b5567a;
    --filament:#7fae59;
    --textile:#8b7bb8;
  }
  * { box-sizing: border-box; }
  .msi2-root{
    background:var(--bg);
    color:var(--text);
    font-family: ui-monospace, "SF Mono", "Courier New", monospace;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--line);
    padding:0;
  }
  .msi2-topbar{
    padding:16px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .msi2-title{
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--yellow);
    font-weight:700;
    margin-bottom:10px;
  }
  .msi2-title span{ color:var(--muted); font-weight:400; margin-left:8px; text-transform:none; letter-spacing:normal; }
  .msi2-search{
    display:flex;
    gap:8px;
  }
  .msi2-search input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:10px 12px;
    border-radius:6px;
    outline:none;
  }
  .msi2-search input:focus{ border-color:var(--yellow); }
  .msi2-status{
    font-size:10px;
    color:var(--muted);
    margin-top:8px;
  }
  .msi2-body{
    display:flex;
    flex-wrap:wrap;
  }
  .msi2-results{
    flex: 1 1 300px;
    min-width:280px;
    max-height:430px;
    overflow-y:auto;
    border-right:1px solid var(--line);
  }
  .msi2-result{
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background 0.12s;
  }
  .msi2-result:hover, .msi2-result.active{
    background:var(--panel);
  }
  .msi2-result-name{
    font-size:13px;
    font-weight:700;
    margin-bottom:3px;
  }
  .msi2-result-loc{
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .msi2-tag{
    display:inline-block;
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:10px;
    color:#111;
    font-weight:700;
    margin:0 4px 4px 0;
  }
  .msi2-report-btn{
    display:inline-block;
    margin-top:8px;
    font-size:10px;
    color:var(--yellow);
    border:1px solid var(--yellow);
    background:none;
    padding:4px 8px;
    border-radius:5px;
    cursor:pointer;
    font-family:inherit;
  }
  .msi2-report-btn:hover{ background:rgba(242,193,78,0.12); }
  .msi2-empty{
    padding:24px 18px;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
  }
  .msi2-map-wrap{
    flex:1 1 260px;
    min-width:260px;
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .msi2-map-wrap svg{
    width:100%;
    max-width:340px;
    height:auto;
  }
  .msi2-zone{
    stroke:#111213;
    stroke-width:1.5;
    opacity:0.55;
    transition:opacity 0.2s, filter 0.2s;
  }
  .msi2-zone.active{
    opacity:1;
    filter:drop-shadow(0 0 6px currentColor);
  }
  .msi2-zone-label{
    font-family: ui-monospace, monospace;
    font-size:8.5px;
    fill:#1a1c1e;
    font-weight:700;
    pointer-events:none;
  }
  .msi2-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-top:14px;
  }
  .msi2-legend-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:10px;
    color:var(--muted);
  }
  .msi2-swatch{
    width:9px; height:9px; border-radius:2px; flex-shrink:0;
  }
</style>

<div class="msi2-root">
  <div class="msi2-topbar">
    <div class="msi2-title">Makerspace Locator <span>// find a part</span></div>
    <div class="msi2-search">
      <input type="text" id="msi2Input" placeholder="try: screwdriver, filament, acrylic..." autocomplete="off">
    </div>
    <div class="msi2-status" id="msi2Status">Loading inventory…</div>
  </div>
  <div class="msi2-body">
    <div class="msi2-results" id="msi2Results"></div>
    <div class="msi2-map-wrap">
      <svg viewBox="0 0 300 200" id="msi2Map">
        <!-- PLACEHOLDER SCHEMATIC MAP — replace this whole <svg> with your traced Inkscape export.
             Each zone needs: class="msi2-zone", a fill matching its category color, and
             data-zone="xxxx" matching the "Map Zone" column in your Sheet. -->
        <rect x="4" y="4" width="292" height="192" fill="none" stroke="#3a3d40" stroke-width="1"/>

        <rect class="msi2-zone" data-zone="electronics" x="12" y="14" width="70" height="80" rx="4" fill="#4fb0a5"/>
        <text class="msi2-zone-label" x="47" y="58" text-anchor="middle">ELEC</text>

        <rect class="msi2-zone" data-zone="wood" x="92" y="14" width="55" height="50" rx="4" fill="#c98a4b"/>
        <text class="msi2-zone-label" x="119" y="42" text-anchor="middle">WOOD</text>

        <rect class="msi2-zone" data-zone="hardware" x="157" y="14" width="55" height="50" rx="4" fill="#6b8fa3"/>
        <text class="msi2-zone-label" x="184" y="42" text-anchor="middle">HDW</text>

        <rect class="msi2-zone" data-zone="laser" x="222" y="14" width="66" height="80" rx="4" fill="#b5567a"/>
        <text class="msi2-zone-label" x="255" y="58" text-anchor="middle">LASER</text>

        <rect class="msi2-zone" data-zone="filament" x="92" y="74" width="55" height="112" rx="4" fill="#7fae59"/>
        <text class="msi2-zone-label" x="119" y="132" text-anchor="middle">PRINT</text>

        <rect class="msi2-zone" data-zone="textile" x="157" y="104" width="55" height="82" rx="4" fill="#8b7bb8"/>
        <text class="msi2-zone-label" x="184" y="148" text-anchor="middle">FABRIC</text>

        <rect class="msi2-zone" data-zone="entrance" x="222" y="104" width="66" height="82" rx="4" fill="#3a3d40"/>
        <text class="msi2-zone-label" x="255" y="148" text-anchor="middle" fill="#e8e6e1">ENTRY</text>
      </svg>
      <div class="msi2-legend" id="msi2Legend"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function(){

  // ---------------------------------------------------------------------
  // CONFIG — swap these for your real published Google Sheet + Form.
  //
  // Sheet: File > Share > Publish to web > choose the "Items" tab > CSV.
  // Columns expected (case-insensitive): Item, Aliases, Category, Location, MapZone, Photo
  //
  // Form: create a Google Form with fields "Item" and "Note", get its
  // prefilled link (⋮ menu > Get pre-filled link), pull the entry.NNNNN ids
  // from the URL it gives you and plug them in below.
  // ---------------------------------------------------------------------
  var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqDUoyAOOzfJa3Y-ZV36W38qzJmRuwjm8dKqFL3Mttc-SebOuuurUQ7dCs9Lg4yzFpHgxPapFgG4pJ/pub?gid=0&single=true&output=csv";
  var REPORT_FORM_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSfpGM3tSwjdYu-TqivDfAFzr-Ts0H-5QGqhw2dJ_6DM7zqjWw/viewform";

  var CATEGORY_COLORS = {
    electronics:'#4fb0a5', wood:'#c98a4b', hardware:'#6b8fa3',
    laser:'#b5567a', filament:'#7fae59', textile:'#8b7bb8', entrance:'#3a3d40'
  };
  var CATEGORY_LABELS = {
    electronics:'Electronics', wood:'Wood Storage', hardware:'Hardware',
    laser:'Laser Materials', filament:'Print Filament', textile:'Textiles'
  };

  // Fallback sample data — used if SHEET_CSV_URL is empty or unreachable,
  // so this demo works standalone. Shape matches what the Sheet should contain.
  var FALLBACK_DATA = [
    { item:'Phillips/Flathead Screwdriver Set', aliases:'screwdriver, driver', category:'hardware, tools', location:'Hardware Wall, Bin C1, top row', zone:'hardware' },
    { item:'Wire Strippers', aliases:'stripper, cutter', category:'electronics, tools', location:'Electronics Rack, Shelf 1, left bin', zone:'electronics' },
    { item:'Soldering Iron', aliases:'solder, iron', category:'electronics, tools', location:'Electronics Rack, Shelf 2, wall mount', zone:'electronics' },
    { item:'PLA Filament — Black', aliases:'filament, pla, plastic', category:'filament, consumable', location:'Print Station, Filament Shelf 1', zone:'filament' },
    { item:'Acrylic Sheet 3mm Clear', aliases:'acrylic, plexiglass, laser stock', category:'laser, consumable', location:'Laser Station, Materials Rack, slot 2', zone:'laser' },
    { item:'M3 Screws', aliases:'screws, fasteners, m3', category:'hardware, consumable', location:'Hardware Wall, Bin C1, bottom row', zone:'hardware' },
    { item:'Wool Felt Sheets', aliases:'felt, embroidery backing', category:'textile, consumable', location:'Textile Bench, Drawer 1', zone:'textile' },
    { item:'Plywood Offcuts', aliases:'plywood, wood scraps', category:'wood, consumable', location:'Wood Storage, Bin A', zone:'wood' },
    { item:'Hot Glue Gun', aliases:'glue gun, hot glue', category:'hardware, tools', location:'Hardware Wall, Bin C2, hanging', zone:'hardware' },
    { item:'Multimeter', aliases:'meter, voltmeter', category:'electronics, tools', location:'Electronics Rack, Shelf 3, right bin', zone:'electronics' }
  ];

  var root = document.currentScript.previousElementSibling.previousElementSibling.previousElementSibling ?
             null : null; // unused, kept simple below

  var resultsEl = document.getElementById('msi2Results');
  var statusEl = document.getElementById('msi2Status');
  var inputEl = document.getElementById('msi2Input');
  var legendEl = document.getElementById('msi2Legend');
  var mapEl = document.getElementById('msi2Map');
  var DATA = [];

  function renderLegend(){
    var html = '';
    Object.keys(CATEGORY_LABELS).forEach(function(k){
      html += '<div class="msi2-legend-item"><div class="msi2-swatch" style="background:'+CATEGORY_COLORS[k]+'"></div>'+CATEGORY_LABELS[k]+'</div>';
    });
    legendEl.innerHTML = html;
  }

  function setActiveZone(zone){
    var zones = mapEl.querySelectorAll('.msi2-zone');
    zones.forEach(function(z){
      z.classList.toggle('active', z.getAttribute('data-zone') === zone);
    });
  }

  function clearZones(){
    mapEl.querySelectorAll('.msi2-zone').forEach(function(z){ z.classList.remove('active'); });
  }

  // Reporting just opens the real form in a new tab — the form itself
  // collects whatever detail is needed, so nothing to prefill or hold state for here.
  function openReportForm(){
    if (REPORT_FORM_BASE) {
      window.open(REPORT_FORM_BASE, '_blank');
    } else {
      alert('Demo mode: no Google Form connected yet.');
    }
  }

  function renderResults(list, query){
    if (!list.length) {
      resultsEl.innerHTML = '<div class="msi2-empty">No matches' + (query ? ' for "' + query + '"' : '') + '. Try a category name, or browse the map to see what\'s in each zone.</div>';
      clearZones();
      return;
    }
    var html = '';
    list.forEach(function(row, i){
      var tagsHtml = row.category.map(function(cat){
        var color = CATEGORY_COLORS[cat];
        var label = CATEGORY_LABELS[cat] || (cat.charAt(0).toUpperCase() + cat.slice(1));
        // Zone categories (electronics, wood, hardware...) get a solid color chip
        // matching the map. Cross-cutting tags (tools, consumable...) that aren't
        // tied to a physical zone get a neutral outlined chip instead.
        if (color) {
          return '<span class="msi2-tag" style="background:' + color + '">' + label + '</span>';
        }
        return '<span class="msi2-tag" style="background:none;border:1px solid var(--line);color:var(--muted)">' + label + '</span>';
      }).join(' ');

      html += '<div class="msi2-result" data-idx="' + i + '" data-zone="' + row.zone + '">'
        + '<div class="msi2-result-name">' + row.item + '</div>'
        + '<div class="msi2-result-loc">' + row.location + '</div>'
        + tagsHtml
        + '<div><button class="msi2-report-btn">Report empty / missing</button></div>'
        + '</div>';
    });
    resultsEl.innerHTML = html;

    resultsEl.querySelectorAll('.msi2-result').forEach(function(el){
      el.addEventListener('click', function(e){
        if (e.target.classList.contains('msi2-report-btn')) return; // let the report button handle its own click
        resultsEl.querySelectorAll('.msi2-result').forEach(function(r){ r.classList.remove('active'); });
        el.classList.add('active');
        setActiveZone(el.getAttribute('data-zone'));
      });
    });
    resultsEl.querySelectorAll('.msi2-report-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        openReportForm();
      });
    });

    // Auto-highlight the map if there's exactly one strong match
    if (list.length === 1) setActiveZone(list[0].zone);
  }

  function search(query){
    query = (query || '').trim().toLowerCase();
    if (!query) { renderResults(DATA.slice(0, 6), ''); return; }
    var matches = DATA.filter(function(row){
      var hay = (row.item + ' ' + row.aliases + ' ' + row.category.join(' ')).toLowerCase();
      return hay.indexOf(query) !== -1;
    });
    renderResults(matches, query);
  }

  inputEl.addEventListener('input', function(){ search(inputEl.value); });

  function normalizeRows(rows){
    return rows.map(function(r){
      var rawCategory = (r.Category || r.category || '').trim();
      return {
        item: (r.Item || r.item || '').trim(),
        aliases: (r.Aliases || r.aliases || '').trim(),
        // Category can be a comma-separated list, e.g. "Electronics, Tools" —
        // these are browse/search tags and can be as many as make sense.
        category: rawCategory.split(',').map(function(c){ return c.trim().toLowerCase(); }).filter(Boolean),
        location: (r.Location || r.location || '').trim(),
        // Zone is singular — it's the one physical spot this item lives,
        // used to light up the map. Keep this to exactly one value per item.
        zone: (r.MapZone || r.mapzone || r.zone || '').trim().toLowerCase()
      };
    }).filter(function(r){ return r.item; });
  }

  function boot(rows, sourceLabel){
    DATA = rows;
    statusEl.textContent = sourceLabel + ' · ' + DATA.length + ' items';
    renderLegend();
    search('');
  }

  // Fallback data is authored with comma-string categories for readability above;
  // normalize it the same way live Sheet rows are normalized.
  FALLBACK_DATA = FALLBACK_DATA.map(function(r){
    return {
      item: r.item, aliases: r.aliases, location: r.location, zone: r.zone,
      category: r.category.split(',').map(function(c){ return c.trim().toLowerCase(); }).filter(Boolean)
    };
  });

  if (SHEET_CSV_URL) {
    // Cache-bust: Google's publish link and some browsers/CDNs cache the CSV,
    // so edits to the Sheet can take a bit to show up otherwise.
    var bustedUrl = SHEET_CSV_URL + (SHEET_CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_ts=' + Date.now();
    Papa.parse(bustedUrl, {
      download: true,
      header: true,
      // Strips stray whitespace and a possible leading BOM character from
      // header names, both of which can silently break the r.Item lookups.
      transformHeader: function(h){ return h.replace(/^\uFEFF/, '').trim(); },
      complete: function(results){
        var rows = normalizeRows(results.data);
        if (rows.length) boot(rows, 'Live from Sheet');
        else boot(FALLBACK_DATA, 'Sheet returned no rows — showing sample data');
      },
      error: function(){
        boot(FALLBACK_DATA, 'Could not reach Sheet — showing sample data');
      }
    });
  } else {
    boot(FALLBACK_DATA, 'Demo mode — sample data');
  }

})();
</script>
