<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1c1e;
    --panel:#212325;
    --line:#3a3d40;
    --text:#e8e6e1;
    --muted:#9a9d9f;
    --yellow:#f2c14e;
    --electronics:#4fb0a5;
    --wood:#c98a4b;
    --hardware:#6b8fa3;
    --laser:#b5567a;
    --filament:#7fae59;
    --textile:#8b7bb8;
    --font: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body{
    background:var(--bg);
    margin:0;
    padding:12px;
    min-height:100%;
  }
  .msi2-root{
    background:var(--bg);
    color:var(--text);
    font-family: var(--font);
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--line);
    padding:0;
  }
  .msi2-topbar{
    padding:16px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .msi2-title{
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--yellow);
    font-weight:700;
    margin-bottom:10px;
  }
  .msi2-title span{ color:var(--muted); font-weight:400; margin-left:8px; text-transform:none; letter-spacing:normal; }
  .msi2-search{
    display:flex;
    gap:8px;
  }
  .msi2-search input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    font-family:inherit;
    font-size:14px;
    padding:10px 12px;
    border-radius:6px;
    outline:none;
  }
  .msi2-search input:focus{ border-color:var(--yellow); }
  .msi2-topbtn{
    flex-shrink:0;
    font-family:inherit;
    font-size:11px;
    color:var(--yellow);
    border:1px solid var(--yellow);
    background:none;
    padding:0 12px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .msi2-topbtn:hover{ background:rgba(242,193,78,0.12); }
  .msi2-status{
    font-size:10px;
    color:var(--muted);
    margin-top:8px;
  }
  .msi2-body{
    display:flex;
    flex-wrap:wrap;
  }
  .msi2-results{
    flex: 1 1 300px;
    min-width:280px;
    max-height:430px;
    overflow-y:auto;
    border-right:1px solid var(--line);
  }
  .msi2-result{
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    transition:background 0.12s;
  }
  .msi2-result:hover, .msi2-result.active{
    background:var(--panel);
  }
  .msi2-result-name{
    font-size:13px;
    font-weight:700;
    margin-bottom:3px;
  }
  .msi2-result-loc{
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .msi2-report-btn{
    display:inline-block;
    margin-top:8px;
    font-size:10px;
    color:var(--yellow);
    border:1px solid var(--yellow);
    background:none;
    padding:4px 8px;
    border-radius:5px;
    cursor:pointer;
    font-family:inherit;
  }
  .msi2-report-btn:hover{ background:rgba(242,193,78,0.12); }
  .msi2-empty{
    padding:24px 18px;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
  }
  .msi2-map-wrap{
    flex:1 1 260px;
    min-width:260px;
    padding:18px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .msi2-map-wrap svg{
    width:100%;
    max-width:340px;
    height:auto;
  }
  .msi2-zone{
    stroke:#111213;
    stroke-width:1.5;
    opacity:0.55;
    transition:opacity 0.2s, filter 0.2s;
  }
  .msi2-zone.active{
    opacity:1;
    filter:drop-shadow(0 0 6px currentColor);
  }
  .msi2-zone-label{
    font-family: var(--font);
    font-size:8.5px;
    fill:#1a1c1e;
    font-weight:700;
    pointer-events:none;
  }
  /* For room outlines, cage boundaries, walls, doors, or any other line that's
     just visual context — NOT an item location. These are deliberately left
     out of .msi2-zone so the JS never touches, highlights, or matches them. */
  .msi2-structure{
    fill:none;
    stroke:var(--text);
    stroke-width:1.5;
    opacity:0.8;
  }
  .msi2-structure.dashed{
    stroke-dasharray:4,3;
    opacity:0.5;
  }
</style>

<div class="msi2-root">
  <div class="msi2-topbar">
    <div class="msi2-title">Makerspace Locator <span>// find a part</span></div>
    <div class="msi2-search">
      <input type="text" id="msi2Input" placeholder="try: screwdriver, filament, acrylic..." autocomplete="off">
      <button class="msi2-topbtn" id="msi2RequestBtn">+ Request item</button>
    </div>
    <div class="msi2-status" id="msi2Status">Loading inventory…</div>
  </div>
  <div class="msi2-body">
    <div class="msi2-results" id="msi2Results"></div>
    <div class="msi2-map-wrap">
      <!-- The actual map lives in a separate file: map.svg, sitting next to
           this html file in the repo. Edit/re-export that file on its own —
           the code below loads whatever's in it at page load. -->
      <div id="msi2Map"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
(function(){

  // ---------------------------------------------------------------------
  // CONFIG — swap these for your real published Google Sheet + Form.
  //
  // Sheet: File > Share > Publish to web > choose the "Items" tab > CSV.
  // Columns expected (case-insensitive): Item, Aliases, Category, Location, MapZone, Photo
  //
  // Form: create a Google Form with fields "Item" and "Note", get its
  // prefilled link (⋮ menu > Get pre-filled link), pull the entry.NNNNN ids
  // from the URL it gives you and plug them in below.
  // ---------------------------------------------------------------------
  var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqDUoyAOOzfJa3Y-ZV36W38qzJmRuwjm8dKqFL3Mttc-SebOuuurUQ7dCs9Lg4yzFpHgxPapFgG4pJ/pub?gid=0&single=true&output=csv";
  var REPORT_FORM_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSfpGM3tSwjdYu-TqivDfAFzr-Ts0H-5QGqhw2dJ_6DM7zqjWw/viewform";
  // Same underlying form. If you grab a pre-filled link (⋮ menu > Get pre-filled
  // link) with "Personal Project" or a new "Requesting new item" option already
  // selected, swap it in here so this button opens pre-answered.
  var MATERIALS_REQUEST_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfpGM3tSwjdYu-TqivDfAFzr-Ts0H-5QGqhw2dJ_6DM7zqjWw/viewform";

  // Fallback sample data — used if SHEET_CSV_URL is empty or unreachable,
  // so this demo works standalone. Shape matches what the Sheet should contain.
  var FALLBACK_DATA = [
    { item:'Phillips/Flathead Screwdriver Set', aliases:'screwdriver, driver', location:'Hardware Wall, Bin C1, top row', zone:'hardware' },
    { item:'Wire Strippers', aliases:'stripper, cutter', location:'Electronics Rack, Shelf 1, left bin', zone:'electronics' },
    { item:'Soldering Iron', aliases:'solder, iron', location:'Electronics Rack, Shelf 2, wall mount', zone:'electronics' },
    { item:'PLA Filament — Black', aliases:'filament, pla, plastic', location:'Print Station, Filament Shelf 1', zone:'filament' },
    { item:'Acrylic Sheet 3mm Clear', aliases:'acrylic, plexiglass, laser stock', location:'Laser Station, Materials Rack, slot 2', zone:'laser' },
    { item:'M3 Screws', aliases:'screws, fasteners, m3', location:'Hardware Wall, Bin C1, bottom row', zone:'hardware' },
    { item:'Wool Felt Sheets', aliases:'felt, embroidery backing', location:'Textile Bench, Drawer 1', zone:'textile' },
    { item:'Plywood Offcuts', aliases:'plywood, wood scraps', location:'Wood Storage, Bin A', zone:'wood' },
    { item:'Hot Glue Gun', aliases:'glue gun, hot glue', location:'Hardware Wall, Bin C2, hanging', zone:'hardware' },
    { item:'Multimeter', aliases:'meter, voltmeter', location:'Electronics Rack, Shelf 3, right bin', zone:'electronics' }
  ];

  var resultsEl = document.getElementById('msi2Results');
  var statusEl = document.getElementById('msi2Status');
  var inputEl = document.getElementById('msi2Input');
  var mapEl = document.getElementById('msi2Map'); // container div — gets filled below

  // Used only if map.svg is missing/unreachable, so the page still shows something.
  var FALLBACK_MAP_SVG = '<svg viewBox="0 0 300 200">'
    + '<rect class="msi2-structure" x="4" y="4" width="292" height="192" rx="2"/>'
    + '<text x="150" y="105" text-anchor="middle" fill="var(--muted)" font-size="9" font-family="ui-monospace, monospace">map.svg not found — using placeholder</text>'
    + '</svg>';

  fetch('map.svg')
    .then(function(res){ if (!res.ok) throw new Error('not found'); return res.text(); })
    .then(function(svgText){ mapEl.innerHTML = svgText; })
    .catch(function(){ mapEl.innerHTML = FALLBACK_MAP_SVG; });
  var DATA = [];

  function setActiveZone(zone){
    var zones = mapEl.querySelectorAll('.msi2-zone');
    zones.forEach(function(z){
      z.classList.toggle('active', z.getAttribute('data-zone') === zone);
    });
  }

  function clearZones(){
    mapEl.querySelectorAll('.msi2-zone').forEach(function(z){ z.classList.remove('active'); });
  }

  // Opens any of the shop's Google Forms in a new tab. Both report and
  // request flows just link out — the form itself collects the detail.
  function openForm(url){
    if (url) {
      window.open(url, '_blank');
    } else {
      alert('Demo mode: no Google Form connected yet.');
    }
  }

  document.getElementById('msi2RequestBtn').addEventListener('click', function(){
    openForm(MATERIALS_REQUEST_FORM_URL);
  });

  function renderResults(list, query){
    if (!list.length) {
      resultsEl.innerHTML = '<div class="msi2-empty">No matches' + (query ? ' for "' + query + '"' : '') + '. Try a different name, or browse the map to see what\'s in each zone.'
        + '<div style="margin-top:10px;"><button class="msi2-topbtn" id="msi2EmptyRequestBtn">+ Request this be added</button></div></div>';
      clearZones();
      var emptyBtn = document.getElementById('msi2EmptyRequestBtn');
      if (emptyBtn) emptyBtn.addEventListener('click', function(){ openForm(MATERIALS_REQUEST_FORM_URL); });
      return;
    }
    var html = '';
    list.forEach(function(row, i){
      html += '<div class="msi2-result" data-idx="' + i + '" data-zone="' + row.zone + '">'
        + '<div class="msi2-result-name">' + row.item + '</div>'
        + '<div class="msi2-result-loc">' + row.location + '</div>'
        + '<div><button class="msi2-report-btn">Report empty / missing</button></div>'
        + '</div>';
    });
    resultsEl.innerHTML = html;

    resultsEl.querySelectorAll('.msi2-result').forEach(function(el){
      el.addEventListener('click', function(e){
        if (e.target.classList.contains('msi2-report-btn')) return; // let the report button handle its own click
        resultsEl.querySelectorAll('.msi2-result').forEach(function(r){ r.classList.remove('active'); });
        el.classList.add('active');
        setActiveZone(el.getAttribute('data-zone'));
      });
    });
    resultsEl.querySelectorAll('.msi2-report-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        openForm(REPORT_FORM_BASE);
      });
    });

    // Auto-highlight the map if there's exactly one strong match
    if (list.length === 1) setActiveZone(list[0].zone);
  }

  function search(query){
    query = (query || '').trim().toLowerCase();
    if (!query) { renderResults(DATA.slice(0, 6), ''); return; }
    var matches = DATA.filter(function(row){
      var hay = (row.item + ' ' + row.aliases).toLowerCase();
      return hay.indexOf(query) !== -1;
    });
    renderResults(matches, query);
  }

  var searchDebounceTimer = null;
  inputEl.addEventListener('input', function(){
    clearTimeout(searchDebounceTimer);
    var val = inputEl.value;
    searchDebounceTimer = setTimeout(function(){ search(val); }, 120);
  });

  function normalizeRows(rows){
    return rows.map(function(r){
      return {
        item: (r.Item || r.item || '').trim(),
        aliases: (r.Aliases || r.aliases || '').trim(),
        location: (r.Location || r.location || '').trim(),
        // Zone is singular — it's the one physical spot this item lives,
        // used to light up the map. Keep this to exactly one value per item.
        zone: (r.MapZone || r.mapzone || r.zone || '').trim().toLowerCase()
      };
    }).filter(function(r){ return r.item; });
  }

  function boot(rows, sourceLabel){
    DATA = rows;
    statusEl.textContent = sourceLabel + ' · ' + DATA.length + ' items';
    search('');
  }

  if (SHEET_CSV_URL) {
    // Cache-bust: Google's publish link and some browsers/CDNs cache the CSV,
    // so edits to the Sheet can take a bit to show up otherwise.
    // Cache-bust in 5-minute buckets rather than on every load — this still
    // picks up Sheet edits within a few minutes, but lets repeat visits within
    // that window hit the browser cache instead of re-downloading every time.
    var cacheBucket = Math.floor(Date.now() / (5 * 60 * 1000));
    var bustedUrl = SHEET_CSV_URL + (SHEET_CSV_URL.indexOf('?') === -1 ? '?' : '&') + '_ts=' + cacheBucket;
    Papa.parse(bustedUrl, {
      download: true,
      header: true,
      // Strips stray whitespace and a possible leading BOM character from
      // header names, both of which can silently break the r.Item lookups.
      transformHeader: function(h){ return h.replace(/^\uFEFF/, '').trim(); },
      complete: function(results){
        var rows = normalizeRows(results.data);
        if (rows.length) boot(rows, 'Live from Sheet');
        else boot(FALLBACK_DATA, 'Sheet returned no rows — showing sample data');
      },
      error: function(){
        boot(FALLBACK_DATA, 'Could not reach Sheet — showing sample data');
      }
    });
  } else {
    boot(FALLBACK_DATA, 'Demo mode — sample data');
  }

})();
</script>
